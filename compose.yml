services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-academico}
      POSTGRES_USER: ${POSTGRES_USER:-academico}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-academico_dev_only}
      PGDATA: /var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-academico} -d ${POSTGRES_DB:-academico}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
