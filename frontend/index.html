<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7fb" />
    <meta name="description" content="Sistema Web de Gestión Académica" />
    <script>
      (function () {
        try {
          var preference = localStorage.getItem("gestion-academica:tema") || "sistema";
          var dark = preference === "oscuro" || (preference === "sistema" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.dataset.theme = dark ? "oscuro" : "claro";
          if (dark) document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0b1220");
        } catch (error) {}
      })();
    </script>
    <title>Acceso · Gestión Académica</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
