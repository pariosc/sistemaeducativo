[project]
name = "sistema-gestion-academica-api"
version = "0.1.0"
description = "API del Sistema Web de Gestión Académica"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=25,<26",
  "fastapi[standard]>=0.120,<1",
  "email-validator>=2.2,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
